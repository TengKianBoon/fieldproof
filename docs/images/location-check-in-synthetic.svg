<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f5f8f3"/><text x="44" y="54" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#173d2b">Location check-in on a map</text><text x="44" y="87" font-family="Arial,sans-serif" font-size="17" fill="#53685b">Shipping FieldProof map renderer · synthetic coordinates · no real person's location</text><g transform="translate(44 118) scale(1.68)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 290" width="240" height="290" role="img" aria-label="Check-in location diagram"><rect x="0" y="0" width="240" height="240" fill="#f4f7f2" stroke="#9bb3a3"/><text x="222" y="20" font-size="12" font-family="sans-serif" fill="#333">N</text><path d="M226 26 L226 44" stroke="#333" stroke-width="1.5"/><path d="M222 32 L226 25 L230 32" fill="none" stroke="#333" stroke-width="1.5"/><circle cx="120" cy="120" r="92.0" fill="rgba(31,90,64,.12)" stroke="#1f5a40" stroke-dasharray="4 3"/><circle cx="120" cy="120" r="2.5" fill="#1f5a40"/><circle cx="181.4" cy="58.6" r="4.6" fill="rgba(30,90,200,.18)" stroke="#1e5ac8"/><circle cx="181.4" cy="58.6" r="3.5" fill="#1e5ac8"/><text x="4" y="254" font-size="11" font-family="sans-serif" fill="#222">Site centre, 100 m radius (dashed)</text><text x="4" y="268" font-size="11" font-family="sans-serif" fill="#222">Check-in, accuracy ±5 m (blue)</text><text x="4" y="282" font-size="11" font-family="sans-serif" fill="#222">94 m from the site centre</text></svg></g><g font-family="Arial,sans-serif" fill="#173d2b"><text x="520" y="160" font-size="25" font-weight="700">Compare the check-in with the planned site</text><text x="520" y="222" font-size="24">Within the planned site radius</text><text x="520" y="270" font-size="24">94 m from the site centre</text><text x="520" y="318" font-size="24">Device-reported accuracy: ±5 m</text><text x="520" y="366" font-size="24">Fix time and server receipt time recorded</text><text x="520" y="438" font-size="23" font-weight="700">A reviewer gets location context</text><text x="520" y="475" font-size="22">before deciding where to follow up.</text><text x="520" y="538" font-size="19">The worker chooses to share one check-in.</text><text x="520" y="570" font-size="19">Photos still count if location is declined.</text></g><text x="44" y="680" font-family="Arial,sans-serif" font-size="17" fill="#53685b">Device location at check-in; it does not establish where a photo was taken. A person makes the final call.</text></svg>